<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>男の娘游戏集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<meta name="description" content="男の娘游戏集 —— 我玩过的视觉小说与 galgame 收藏册。">
<meta property="og:title" content="男の娘游戏集">
<meta property="og:description" content="我玩过的视觉小说与 galgame 收藏册。">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" onload="this.onload=null;this.rel='stylesheet'">
<style>

:root{
  --bg:#0e090a;
  --gold:#e89aa2;
  --gold-dim:#b97f8c;
  --text:#f5e6e4;
  --text-dim:rgba(245,230,228,.52);
  --green:#a9c48f;
  --grey:#ab9a9a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* 表里原本没有任何 a 规则，官网角标是第一个链接 —— 不重置会带上默认蓝紫色和下划线 */
a{color:inherit;text-decoration:none}
body{
  background:radial-gradient(1500px 950px at 50% 24%,#2e1a1e 0%,#1a0f12 55%,#0c0708 100%) fixed var(--bg);
  color:var(--text);
  font-family:"LXGW WenKai","LXGW WenKai Screen","Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.locked{overflow:hidden}
::selection{background:rgba(232,154,162,.3)}

/* ---------- ambient background ---------- */
/* ---------- patterned backdrop: shippo ground (sakura-shaped cutouts) + constellations + blossoms ---------- */
#patwrap{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.pat-a{
  position:absolute;inset:0;opacity:.048;background-size:44px 44px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 44 44'><g fill='none' stroke='%23e89aa2' stroke-width='1'><circle cx='22' cy='22' r='22'/><circle cx='0' cy='0' r='22'/><circle cx='44' cy='0' r='22'/><circle cx='0' cy='44' r='22'/><circle cx='44' cy='44' r='22'/></g></svg>");
}
.pat-d{position:absolute;inset:0}
/* 樱花：要"不显眼"而不是"颜色浅"——颜色回到 v5，只压低透明度 */
.blossom{position:absolute;font-size:560px;opacity:.12;top:-190px;left:-130px;transform:rotate(14deg);filter:grayscale(.2) sepia(.42) brightness(.66) saturate(1)}
.blossom.b2{font-size:640px;opacity:.11;top:auto;left:auto;bottom:-210px;right:-150px;transform:rotate(-18deg)}
.petal-frag{position:absolute;background:rgba(232,154,162,.15);border-radius:100% 0 100% 0}
/* stardust rides on top of everything (incl. the intro veil) — 有意为之 */
#pcv{position:fixed;inset:0;z-index:200;pointer-events:none}
.glow{position:fixed;border-radius:50%;filter:blur(100px);z-index:0;pointer-events:none}
.g0{width:1900px;height:1050px;top:-470px;left:50%;margin-left:-950px;background:radial-gradient(ellipse at center,rgba(210,110,120,.42),transparent 66%);filter:blur(70px)}
.g1{width:840px;height:840px;top:-330px;left:-270px;background:radial-gradient(circle,rgba(232,136,146,.46),transparent 70%);animation:drift1 70s ease-in-out infinite alternate}
.g2{width:740px;height:740px;right:-290px;bottom:-310px;background:radial-gradient(circle,rgba(196,110,140,.36),transparent 70%);animation:drift2 92s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(150px,110px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-160px,-80px)}}
.noise{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  background-size:180px 180px;
}

/* ---------- top bar (solid, no glass) ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(rgba(14,9,10,.97),rgba(14,9,10,.84));
  border-bottom:1px solid rgba(232,154,162,.18);
}
.topbar-inner{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:26px;
  padding:22px 46px 16px;
}
.brand .logo{font-size:19px;letter-spacing:.25em;color:var(--text)}
.brand .logo em{font-style:normal;color:var(--gold)}
.brand .sub{font-size:9.5px;letter-spacing:.46em;color:rgba(245,230,228,.3);margin-top:5px}
.counter{font-size:12px;letter-spacing:.2em;color:var(--text-dim);white-space:nowrap}
.counter b{color:var(--gold);font-weight:500}
.counter .sep{opacity:.4;margin:0 .75em}

/* ---------- the list: one game per row (tile + info board) ---------- */
.grid{
  position:relative;z-index:5;
  display:flex;flex-direction:column;
  gap:58px;
  max-width:1280px;margin:0 auto;
  padding:64px 46px 150px;
}
.cell{
  position:relative;
  display:flex;gap:48px;align-items:stretch;
  opacity:.45;
  filter:blur(7px) brightness(.6) saturate(.55);
  transform:translateY(34px) rotate(var(--r0,0deg)) scale(.97);
  transition:opacity 1s ease,filter 1s ease,transform 1.1s cubic-bezier(.2,1.32,.34,1);
  transition-delay:calc(var(--i) * 42ms + 60ms);
  will-change:transform,opacity;
}
.grid.enter .cell{opacity:1;filter:none;transform:none}

/* tile: the acrylic brick (keeps all hover behaviour) */
.tile{position:relative;width:150px;flex:none}
.halo{
  position:absolute;inset:-8px;z-index:0;pointer-events:none;opacity:0;
  background:conic-gradient(from 210deg,#ff5f7a,#ffb454,#f6f36a,#7dff9a,#5ad0ff,#8f7bff,#ff6ad5,#ff5f7a);
  filter:blur(20px) saturate(1.15);
  transition:opacity .5s ease;
}
.cell:has(.card:hover) .halo{opacity:.34}
.card{
  position:relative;z-index:1;aspect-ratio:2/3;cursor:default;
  border-radius:0;
  background:rgba(28,17,19,.65);
  box-shadow:
    0 1px 0 rgba(255,246,228,.14),
    0 3px 0 rgba(255,246,228,.05),
    0 7px 0 rgba(0,0,0,.32),
    0 20px 36px rgba(0,0,0,.5);
  transform:perspective(850px)
            rotate(calc(var(--r,0) * 1deg)) translateY(calc(var(--dy,0) * 1px))
            rotateY(calc(var(--tx,0) * 7deg))
            rotateX(calc(var(--ty,0) * -5.5deg));
  transition:transform .5s cubic-bezier(.2,.8,.25,1.12),box-shadow .45s ease;
}
.card:hover{
  z-index:6;
  transform:perspective(850px)
            rotate(calc(var(--r,0) * 1deg)) translateY(calc(var(--dy,0) * 1px - 9px))
            rotateY(calc(var(--tx,0) * 7deg))
            rotateX(calc(var(--ty,0) * -5.5deg));
  box-shadow:
    0 1px 0 rgba(255,246,228,.22),
    0 3px 0 rgba(255,246,228,.07),
    0 7px 0 rgba(0,0,0,.3),
    0 30px 56px rgba(0,0,0,.6),
    0 0 26px rgba(232,154,162,.34),
    0 0 56px rgba(220,120,160,.22),
    0 0 88px rgba(255,140,160,.14);
}
.view{position:absolute;inset:0;overflow:hidden;background:#0f0a0b}
.view img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.001);transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .5s}
/* 封面缺失时的占位砖（Steam 还没出竖版素材时用）—— 设计成一块"待揭幕"的砖，不是破图 */
.view.nocover{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px 12px;
  background:linear-gradient(155deg,rgba(94,48,56,.85) 0%,rgba(38,22,26,.95) 100%);
  text-align:center;
}
.view.nocover::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120px 150px at 50% 28%,rgba(232,154,162,.20),transparent 72%);
}
.view.nocover .nc-mark{font-size:26px;line-height:1;filter:grayscale(.25) sepia(.3) brightness(.85);opacity:.75}
.view.nocover .nc-zh{position:relative;font-size:14px;letter-spacing:.06em;line-height:1.45;color:rgba(245,230,228,.88)}
.view.nocover .nc-orig{position:relative;font-size:10px;letter-spacing:.1em;line-height:1.5;color:rgba(245,230,228,.45)}
.view.nocover .nc-tag{position:relative;margin-top:3px;font-size:8.5px;letter-spacing:.28em;color:rgba(232,154,162,.7)}
.card:hover .view img{transform:scale(1.04)}
.view::after{ /* shading under the glass */
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 20px rgba(0,0,0,.25),inset 0 -4px 8px rgba(0,0,0,.28),inset -1px 0 0 rgba(0,0,0,.22);
}

/* ---------- 官网角标（封面右上角，只有符号不写字） ----------
   放在 .view 外面：.view 有 overflow:hidden 且是 3D 变换层。
   z-index:7 要盖过 .glass(z5)；.prism(z3) 无所谓但也没冲突。
   24×24 是触控最小可点尺寸，别缩。 */
.golink{
  position:absolute;top:6px;right:6px;z-index:7;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:.72;
  /* 封面普遍是亮色（平均亮度 177），底色太透会糊在图上认不出来 ——
     用近实心深色 + 细描边，保证在任意封面上都能看清 */
  background:rgba(14,8,10,.82);
  box-shadow:0 1px 4px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,236,240,.22);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  transition:opacity .25s ease,background-color .25s ease;
}
.golink svg{width:13px;height:13px;stroke:#fdf3f4;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s ease}
/* 高亮同时挂 :hover（正常浏览器走这条）和 .is-hot（JS 加的类）。
   为什么两份都要：角标位于 .card 这个带 3D transform 的合成层里，
   实测在 headless/部分合成路径下 :hover 会"匹配得上但样式不生效"，
   靠 JS 加类可以保证任何环境下都有反馈。两者不冲突，重复声明无害。 */
.golink:hover,.golink:focus-visible,.golink.is-hot{opacity:1;background:rgba(178,88,112,.92)}
.golink:hover svg,.golink:focus-visible svg,.golink.is-hot svg{stroke:#fff8f9}

/* acrylic glass surface: prism edges, corner glints, diagonal sheen */
.glass{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  mix-blend-mode:screen;
  background:
    radial-gradient(42px 42px at 0 0,rgba(255,255,255,.14),transparent 72%),
    radial-gradient(34px 34px at 100% 0,rgba(255,255,255,.09),transparent 72%),
    radial-gradient(46px 46px at 100% 100%,rgba(255,255,255,.06),transparent 72%),
    radial-gradient(38px 38px at 0 100%,rgba(255,255,255,.05),transparent 72%),
    linear-gradient(133deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 24%,transparent 40%,transparent 63%,rgba(255,255,255,.025) 80%,rgba(255,255,255,.07) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.2),
    inset 0 1px 0 rgba(255,255,255,.36),
    inset 1px 0 0 rgba(255,255,255,.1);
}

/* played — warm memory */
.card.played .view img{filter:saturate(1.05) brightness(1.04)}
.card.played:hover .view img{filter:saturate(1.08) brightness(1.1)}
.card.played .view::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 30%,rgba(255,226,170,.1),transparent 64%);
}

/* playing — spirit in motion */
.card.playing .view img{filter:saturate(1.02)}
.card.playing:hover .view img{filter:saturate(1.05) brightness(1.06)}

/* wish — 封面同样彩色展示（状态由信息板徽章表示） */

/* prismatic scattering — the rainbow light follows the cursor
   （用户反馈"散射太强"，调弱：半径 190->140、透明度整体降约 35%、
     blur 6.5->9 让色带更糊、saturate 1.4->1.15 收一点艳度） */
.prism{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  opacity:0;transition:opacity .4s ease;
  mix-blend-mode:screen;
  background:radial-gradient(140px circle at var(--mx,50%) var(--my,42%),
    rgba(255,92,112,.38),rgba(255,196,76,.34) 16%,rgba(130,255,150,.31) 32%,
    rgba(80,178,255,.34) 48%,rgba(190,120,255,.36) 64%,rgba(255,92,112,0) 79%);
  filter:blur(9px) saturate(1.15);
}
.card:hover .prism{opacity:.5}

/* info board: the old modal contents, sitting right beside the tile */
.info{
  flex:1;min-width:0;position:relative;
  display:flex;flex-direction:column;justify-content:center;
  padding:24px 42px;
  background:linear-gradient(150deg,rgba(62,34,38,.5) 0%,rgba(28,17,19,.62) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,232,228,.12),
    inset 0 1px 0 rgba(255,232,228,.18),
    0 22px 44px rgba(0,0,0,.42);
}
.info::after{ /* soft glass sheen */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(180px 100px at 0 0,rgba(255,232,228,.07),transparent 72%),
    linear-gradient(120deg,rgba(255,232,228,.05) 0%,transparent 42%);
}
.info-head{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:7px}
.info-head h3{font-size:23px;font-weight:400;letter-spacing:.05em;margin:0;line-height:1.3}
.badge{padding:3px 12px;border:1px solid;font-size:11.5px;letter-spacing:.2em;flex:none;white-space:nowrap}
.badge.played{color:var(--gold);border-color:rgba(232,154,162,.5)}
.badge.playing{color:var(--green);border-color:rgba(169,196,143,.5)}
.badge.wish{color:var(--grey);border-color:rgba(171,154,154,.5)}
.orig{font-size:12.5px;letter-spacing:.1em;color:var(--text-dim);margin:0 0 12px}
.stars{font-size:14.5px;letter-spacing:.3em;color:var(--gold);margin-bottom:12px}
.stars .off{color:rgba(255,255,255,.13)}
.stars .none{font-size:12px;letter-spacing:.22em;color:var(--grey)}
.note{font-size:14.5px;line-height:1.95;letter-spacing:.02em;color:rgba(245,230,228,.85);margin:0}

/* ---------- footer ---------- */
.foot{
  position:relative;z-index:5;text-align:center;
  padding:0 0 46px;font-size:10.5px;letter-spacing:.3em;color:rgba(245,230,228,.26);
}

/* ---------- intro splash (semi-transparent veil) ---------- */
#intro{
  position:fixed;inset:0;z-index:100;cursor:pointer;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(860px 560px at 50% 43%,
    rgba(10,6,7,.92) 0%,rgba(10,6,7,.62) 55%,rgba(11,7,8,.26) 100%);
  transition:opacity .9s ease,visibility .9s;
}
#intro.gone{opacity:0;visibility:hidden}
.intro-inner{text-align:center;transform:translateY(-2vh)}
#intro h1{
  font-size:46px;font-weight:400;letter-spacing:.3em;text-indent:.3em;
  margin:0 0 22px;color:var(--text);
  opacity:0;animation:fadeUp 1.5s .25s ease forwards;
}
#intro h1 em{font-style:normal;color:var(--gold)}
.intro-sub{
  font-size:13.5px;letter-spacing:.34em;color:rgba(245,230,228,.55);
  margin:0 0 68px;text-shadow:0 0 18px rgba(0,0,0,.9);
  opacity:0;animation:fadeUp 1.5s .8s ease forwards;
}
.intro-click{
  font-size:10.5px;letter-spacing:.42em;color:var(--gold-dim);
  opacity:0;animation:fadeUp 1.3s 1.5s ease forwards;
}
.intro-click span{display:inline-block;animation:breathe 2.6s 2.4s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.intro-line{width:1px;height:56px;margin:34px auto 30px;background:linear-gradient(transparent,rgba(232,154,162,.55),transparent);opacity:0;animation:fadeUp 1.3s 1.15s ease forwards}
.sweep{
  position:absolute;top:-10%;bottom:-10%;left:-30%;width:20vw;pointer-events:none;
  background:linear-gradient(100deg,
    transparent 0%,rgba(255,214,222,0) 16%,rgba(255,214,222,.22) 42%,
    rgba(255,236,240,.4) 50%,rgba(255,214,222,.22) 58%,rgba(255,214,222,0) 84%,transparent 100%);
  transform:skewX(-14deg) translateX(0);opacity:0;
}
#intro.sweeping .sweep{animation:sweep 1.15s cubic-bezier(.45,.05,.35,1) forwards}
@keyframes sweep{
  0%{opacity:0;transform:skewX(-14deg) translateX(0)}
  12%{opacity:1}
  88%{opacity:1}
  100%{opacity:0;transform:skewX(-14deg) translateX(140vw)}
}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(245,230,228,.14)}
::-webkit-scrollbar-thumb:hover{background:rgba(232,154,162,.35)}

@media (max-width:900px){
  .topbar-inner{padding:16px 20px 12px}
  .grid{padding:40px 20px 90px;gap:56px}
  .cell{flex-direction:column;gap:26px}
  .tile{width:62%;margin:0 auto}
  .info{padding:26px 24px}
  #intro h1{font-size:30px;letter-spacing:.32em;text-indent:.32em}
  .intro-sub{font-size:12px;letter-spacing:.18em;padding:0 20px}
  /* 窄屏下这句英文副标题会折行——缩紧字距让它留在一条线上 */
  .brand .sub{letter-spacing:.16em;font-size:8px}
  .topbar-inner{gap:10px}
  /* 窄屏顶栏要同时塞下「🌸站名 + 英文副标题 + 统计」。
     统计从「14/16」改成「收录 16 部·14 部已通关」后变宽，会把品牌挤到折行
     （"男の娘游戏 / 集"），所以这里三样一起收字距/字号。文案不改，只压排布。 */
  .brand .logo{font-size:16px;letter-spacing:.1em}
  .counter{font-size:10px;letter-spacing:.04em}
  .counter .sep{margin:0 .35em}
  /* 页脚文案有 18 字符（原来只有 8 字），.3em 的字距在 390px 下会折行 */
  .foot{letter-spacing:.18em}
}
</style>
</head>

<script>
/* =====================================================================

   ===================================================================== */
const GAMES = [
  /* —— 近月少女的礼仪系列（Navel，按剧情顺序书写） —— */
  {slug:'tsukiniyorisou-1',   zh:'近月少女的礼仪',        orig:'月に寄りそう乙女の作法',                year:2012, status:'played', series:'tsukiniyorisou', stars:5, note:'朝日娘很可爱，女装潜入题材最高的山', site:'http://project-navel.com/tsukiniyorisou/'},
  {slug:'otomeriron',         zh:'少女理论及其周边',      orig:'乙女理論とその周辺 -Ecole de Paris-',   year:2013, status:'played', series:'tsukiniyorisou', stars:5, note:'妹妹线牛逼，全家都是游星控', site:'http://project-navel.com/otomeriron/'},
  {slug:'tsukiniyorisou-2',   zh:'近月少女的礼仪2',       orig:'月に寄りそう乙女の作法2',               year:2014, status:'played', series:'tsukiniyorisou', stars:5, note:'略逊色于一代，才华有点高傲，感觉不如大藏游星，这波是富二代开局不如平民开局', site:'http://project-navel.com/tsukiniyorisou_2nd/'},
  {slug:'belle-epoque',       zh:'少女理论及其之后的周边', orig:'乙女理論とその後の周辺 -Belle Époque-', year:2016, status:'played', series:'tsukiniyorisou', stars:5, note:'挺好的', site:'http://project-navel.com/otome_sonogo/'},
  {slug:'tsukiniyorisou-2-1', zh:'近月少女的礼仪2.1',     orig:'月に寄りそう乙女の作法2.1 E×S×PAR!!',  year:2017, status:'played', series:'tsukiniyorisou', stars:5, site:'http://project-navel.com/tsukiniyorisou_2nd_espar/'},
  {slug:'tsukiniyorisou-2-2', zh:'近月少女的礼仪2.2',     orig:'月に寄りそう乙女の作法2.2 A×L+SA!!',   year:2017, status:'played', series:'tsukiniyorisou', stars:5, site:'http://project-navel.com/tsukiniyorisou_2nd_alsa/'},
  /* —— 其他 —— */
  {slug:'otoboku-1',   zh:'少女爱上姐姐',               orig:'処女はお姉さまに恋してる',              year:2005, status:'played', series:'otoboku', stars:5, note:'女装潜入题材的开山之作（大概）', site:'https://vndb.org/v195'},
  {slug:'mugenkairou', zh:'梦幻廻廊',                   orig:'夢幻廻廊',                              year:2005, status:'played', stars:3, note:'第一个让我玩出内伤的女装游戏，过剧情都是sancheck，整整打了3个月才打完，也许抖m会喜欢吧。', site:'https://www.cyc-soft.com/b-cyc-pro/mugen/index.htm'},
  {slug:'kirakira',    zh:'KIRA☆KIRA 煌煌舞台',         orig:'キラ☆キラ',                             year:2007, status:'played', stars:5, note:'非常好的作品，能让人感叹青春。放在这里是因为男主后面会穿女装开巡演……', site:'http://project.over-drive.jp/kirakira/'},
  {slug:'ruitomo',     zh:'智以类聚',                   orig:'るいは智を呼ぶ',                        year:2008, status:'played', stars:5, note:'非常新奇的作品，玩了那么久第一次遇到女装题材既没有校园也没有教堂', site:'http://www.akatsukiworks.com/product/ruitomo/product.html'},
  {slug:'otoboku-2',   zh:'少女爱上姐姐2',              orig:'処女はお姉さまに恋してる ～2人のエルダー～', year:2010, status:'played', series:'otoboku', stars:4, note:'玩的时候有既视感，剧情安排上和一代有点重复', site:'https://vndb.org/v3861'},
  {slug:'tenshi-hane', zh:'不要践踏天使的羽毛',         orig:'天使の羽根を踏まないでっ',              year:2011, status:'played', stars:4, note:'理想中的男の娘，强大又美丽', site:'https://vndb.org/v6411'},
  {slug:'mangekyou-4', zh:'美少女万华镜4 -罪与罚的少女-', orig:'美少女万華鏡 -罪と罰の少女-',         year:2017, status:'played', stars:4, note:'男主很色，badend很美味', site:'https://vndb.org/v19182'},
  {slug:'monkeys',     zh:'Monkeys!¡',                  orig:'Monkeys!¡',                             year:2021, status:'played', stars:4, note:'搞笑题材耳目一新，但从头到尾一直搞笑就有点乏力了', site:'https://harukaze-soft.com/monkeys/'},
  /* —— No Strike「女装百合」系列 —— */
  {slug:'trap-yuri-garden', zh:'女装百合畑',             orig:'女装百合畑',                            year:2024, status:'played', series:'trap-yuri', stars:4, note:'女装百合，难得一遇，剧情推进还算合理，但就是太短了', site:'https://no-strike.jp/'},
  {slug:'trap-yuri-storm',  zh:'女装百合岚',             orig:'女装百合嵐',                            year:2026, status:'wish',    series:'trap-yuri', site:'https://no-strike.jp/'},
];
/* =================================================================== */

const STATUS = {
  played : {badge:'已玩'},
  playing: {badge:'进行中'},
  wish   : {badge:'未玩'},
};

const grid = document.getElementById('grid');
const intro = document.getElementById('intro');

/* ---------- patterned backdrop: shippo ground with sakura cutouts + petals ---------- */
(function backdrop(){
  const wrap = document.getElementById('patwrap');

  // a few fallen petals, scattered
  for (let i = 0; i < 16; i++) {
    const s = 14 + Math.random()*22;
    const pt = document.createElement('i');
    pt.className = 'petal-frag';
    pt.style.cssText = `width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;transform:rotate(${(Math.random()*360).toFixed(0)}deg)`;
    wrap.appendChild(pt);
  }

  // shippo ground, with the pattern "cut away" wherever a blossom sits
  const patA = document.getElementById('pat-a');

  // --- sakura cutout geometry, derived from the LIVE blossom rects ---
  // Measured off the rendered 🌸 emoji in headless Edge: petal tips reach
  // 0.507 * font-size from the glyph centre, and the lobes sit every 72deg
  // starting at +10deg. The petal ellipse below reaches 1.02R, so R here maps to
  // roughly 1.02 * R of actual cutout radius.
  const EMOJI_INK = 0.44;
  const PETAL_COUNT = 5;
  const PETAL_PHASE = 10;    // degrees; matches the emoji's lobe phase
  // The emoji's notches sit at only ~0.76 of its tip radius, so a cutout matching the
  // tips alone leaves pattern slivers in those notches. CUTOUT_SLACK grows the cutout
  // just enough to fully contain the glyph.
  const CUTOUT_SLACK = 1.06;
  // one petal = a rounded lobe centred at 0.50R along its own direction, long axis outward
  function petals(out, r) {
    const cy = (r * 0.50).toFixed(2), rx = (r * 0.48).toFixed(2), ry = (r * 0.52).toFixed(2);
    for (let i = 0; i < PETAL_COUNT; i++) {
      // NB: SVG rotate() runs CLOCKWISE in screen coords and we enumerate clockwise too,
      // so the petal always points along its own rotated -Y axis. (Mixing this up with CSS
      // counter-clockwise angles squashes all five petals into one blob.)
      const a = PETAL_PHASE + (360 / PETAL_COUNT) * i;
      out.push(`<ellipse cx='0' cy='${-cy}' rx='${rx}' ry='${ry}' transform='rotate(${a})'/>`);
    }
  }
  // one blossom = 5 petals + a soft core, offset from the glyph-box centre by the
  // measured ink offset (dx/dy are fractions of font-size)
  function blossomMask(rect, fs, dx, dy, out) {
    const r = Math.min(fs * EMOJI_INK * CUTOUT_SLACK, 350);
    const cx = rect.left + rect.width / 2 + dx * fs;
    const cy = rect.top + rect.height / 2 + dy * fs;
    out.push(`<g transform='translate(${cx.toFixed(1)} ${cy.toFixed(1)})' fill='#fff'>`);
    petals(out, r);
    out.push(`<circle r='${(r * 0.22).toFixed(2)}'/>`);
    out.push(`</g>`);
  }
  function applyMask(){
    const W = innerWidth, H = innerHeight;
    const shapes = [];
    const b1 = document.querySelector('.blossom.b1').getBoundingClientRect();
    const b2 = document.querySelector('.blossom.b2').getBoundingClientRect();
    blossomMask(b1, 560, 0.018, 0.078, shapes);
    blossomMask(b2, 640, -0.013, 0.009, shapes);
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'>${shapes.join('')}</svg>`;
    // NOTE: base64, NOT `;utf8,` + raw markup — a literal `#` inside the SVG starts a
    // URL fragment and truncates the data URI at `fill=`, which silently kills the
    // whole mask layer (the cutout then never happened at all).
    const uri = `url("data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}")`;
    const m = `linear-gradient(#fff, #fff), ${uri}`;
    patA.style.webkitMaskImage = m;  patA.style.webkitMaskComposite = 'xor';
    patA.style.maskImage = m;        patA.style.maskComposite = 'exclude';
    patA.style.webkitMaskRepeat = 'no-repeat'; patA.style.maskRepeat = 'no-repeat';
  }
  applyMask();
  addEventListener('resize', applyMask);
})();

/* ---------- stardust: drifting motes that link to the cursor ---------- */
(function stardust(){
  const cv = document.getElementById('pcv');
  const ctx = cv.getContext('2d');
  // 星尘颜色：canvas 画的东西 CSS 管不到，只能写在这里。改配色时记得同步这一处。
  const DUST = '245,222,226';   // 柔和玫瑰白（暮金时代是 240,223,174）
  const SHINE = '255,238,240';
  let W, H; const DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize(); window.addEventListener('resize', resize);
  const N = 130, R = 150, P = [];
  for (let i = 0; i < N; i++) {
    P.push({ x: Math.random()*W, y: Math.random()*H,
             vx: (Math.random()-.5)*.16, vy: -(.04 + Math.random()*.14),
             r: .7 + Math.random()*1.5, b: .22 + Math.random()*.4,
             big: Math.random() < .1 });
  }
  let mx = -9999, my = -9999;
  window.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; }, {passive:true});
  document.addEventListener('mouseleave', function(){ mx = -9999; my = -9999; });
  (function loop(){
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      const p = P[i];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -12) { p.y = H + 12; p.x = Math.random()*W; }
      if (p.x < -12) p.x = W + 12;
      if (p.x > W + 12) p.x = -12;
      const dx = p.x - mx, dy = p.y - my;
      const d = Math.sqrt(dx*dx + dy*dy);
      const near = d < R;
      const a = Math.min(1, p.b + (near ? (1 - d/R) * .75 : 0));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + DUST + ',' + a.toFixed(2) + ')';
      if (p.big) { ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(' + SHINE + ',.8)'; }
      ctx.fill(); ctx.shadowBlur = 0;
      if (near) {
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mx, my);
        ctx.strokeStyle = 'rgba(' + DUST + ',' + ((1 - d/R) * .5).toFixed(2) + ')';
        ctx.lineWidth = .7; ctx.stroke();
      }
    }
    // NB: no dot drawn at the cursor itself — the user asked for no "star that follows
    // the mouse". The link lines above are what remains of the cursor reaction.
    requestAnimationFrame(loop);
  })();
})();

/* ---------- ambient glows drift with the pointer ---------- */
const g1 = document.querySelector('.g1');
const g2 = document.querySelector('.g2');
let pTx = 0, pTy = 0, cTx = 0, cTy = 0;
document.addEventListener('mousemove', e => {
  pTx = (e.clientX / window.innerWidth) * 2 - 1;
  pTy = (e.clientY / window.innerHeight) * 2 - 1;
}, { passive:true });
(function glowLoop(){
  cTx += (pTx - cTx) * 0.055;
  cTy += (pTy - cTy) * 0.055;
  const sy = window.scrollY || 0;                       // gentle scroll parallax for the glows
  g1.style.marginLeft = (cTx * 16).toFixed(1) + 'px';
  g1.style.marginTop  = (cTy * 11 - sy * 0.03).toFixed(1) + 'px';
  g2.style.marginLeft = (-cTx * 11).toFixed(1) + 'px';
  g2.style.marginTop  = (-cTy * 8 + sy * 0.05).toFixed(1) + 'px';
  requestAnimationFrame(glowLoop);
})();

/* ---------- 显示顺序 ----------
   系列之间按"该系列最新一部"的年份倒序；系列之内也按年份倒序。
   同年并列时按该组在 GAMES 里首次出现的位置排 —— 所以 2017 年的单部作品
   （万华镜4，数组中靠前）会排在 2017 年收尾的近月系列前面。
   注意：系列内也是倒序 —— 这是用户明确选定的（近月系列会呈现 2.2 → … → 近月1）。
   GAMES 数组本身保持按剧情/年份书写，排版全部交给这里。 */
function displayOrder(){
  const groups = new Map();
  GAMES.forEach((g, i) => {
    const key = g.series || ('__solo__' + g.slug);   // 没写 series 的各自成组
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ g, i });
  });

  // 每组算出两个排序键：组内最新年份、组在 GAMES 里首次出现的位置
  const items = [];
  groups.forEach(m => {
    const sorted = m.slice().sort((a, b) => (b.g.year - a.g.year) || (a.i - b.i));
    let newest = 0, first = Infinity;
    for (const x of m) {
      if (x.g.year > newest) newest = x.g.year;
      if (x.i < first) first = x.i;
    }
    items.push({ sorted, newest, first });
  });

  // 组间：最新年份倒序；并列则先出现的组在前
  items.sort((A, B) => {
    if (B.newest !== A.newest) return B.newest - A.newest;
    return A.first - B.first;
  });

  const out = [];
  for (const it of items) for (const x of it.sorted) out.push(x.g);
  return out;
}

/* ---------- render the list ---------- */
function render(){
  const list = displayOrder();
  grid.innerHTML = list.map((g,i)=>{
    const r    = (((i*37)%9) - 4) * 0.34;      // resting tilt  ~ -1.36..1.36 deg
    const dy   = (((i*53)%7) - 3) * 3.2;       // resting offset ~ -9.6..9.6 px
    const r0   = (((i*29)%11) - 5) * 0.9;      // entrance scatter tilt
    const s    = STATUS[g.status];
    let starsHtml = '';
    // 没打分的条目这里就是空的 —— 名称下面不再显示「— 进行中 —」「— 未玩 · 等待开启 —」
    // 这类占位文字（用户要求：未玩/在玩的都不显示这种字样）。
    // 状态仍然由右上角的徽章表达，别把占位文案加回来。
    if (g.stars) {
      starsHtml = '★'.repeat(g.stars) + `<span class="off">${'★'.repeat(5 - g.stars)}</span>`;
    }
    // cover:false -> 官方还没出竖版封面素材，用占位砖（别留个破图）
    // .prism / .glass 必须留在 .view 里面（倾斜彩虹光靠它们）
    const inner = g.cover === false
      ? `<div class="nc-mark">🌸</div>
         <div class="nc-zh">${g.zh}</div>
         <div class="nc-orig">${g.orig}</div>
         <div class="nc-tag">封面征集中</div>`
      : `<img src="images/${g.slug}.jpg" alt="${g.zh}" loading="lazy">`;
    const coverHtml = `<div class="view${g.cover === false ? ' nocover' : ''}">
           ${inner}
           <i class="prism"></i>
           <i class="glass"></i>
         </div>`;
    // 官网角标：只有符号，没有文字。rel 必须带 noopener/noreferrer —— 否则新开的页面
    // 能通过 window.opener 反控本站。没填 site 的条目整个 <a> 不输出。
    const linkHtml = g.site
      ? `<a class="golink" href="${g.site}" target="_blank" rel="noopener noreferrer"
            aria-label="${g.zh} 官网" title="${g.zh} 官网"
         ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M18 14.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4.5"/></svg></a>`
      : '';
    return `
    <div class="cell" style="--i:${i};--r0:${r0.toFixed(2)}deg">
      <div class="tile">
        <i class="halo"></i>
        <div class="card ${g.status}" data-i="${i}" style="--r:${r.toFixed(2)};--dy:${dy.toFixed(1)}">
          ${coverHtml}
          ${linkHtml}
        </div>
      </div>
      <div class="info">
        <div class="info-head">
          <h3>${g.zh}</h3>
          <span class="badge ${g.status}">${s.badge}</span>
        </div>
        <p class="orig">${g.orig}&ensp;·&ensp;${g.year}&ensp;·&ensp;PC</p>
        ${starsHtml ? `<div class="stars">${starsHtml}</div>` : ''}
        ${g.note ? `<p class="note">${g.note}</p>` : ''}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(el=>{
    // prism light + per-tile tilt follow the cursor (this tile only)
    el.addEventListener('mousemove',e=>{
      const b = el.getBoundingClientRect();
      const px = (e.clientX - b.left) / b.width;
      const py = (e.clientY - b.top) / b.height;
      el.style.setProperty('--mx',(px*100).toFixed(1)+'%');
      el.style.setProperty('--my',(py*100).toFixed(1)+'%');
      el.style.setProperty('--tx',(px*2-1).toFixed(3));
      el.style.setProperty('--ty',(py*2-1).toFixed(3));
    },{passive:true});
    el.addEventListener('mouseleave',()=>{
      el.style.setProperty('--tx','0');
      el.style.setProperty('--ty','0');
    });
  });

  // 官网角标的高亮：JS 挂 .is-hot，保证在 :hover 样式不生效的合成路径下也有反馈。
  // 另外点一下就把高亮撤掉 —— 新标签页接管后鼠标还停在角标上，
  // 不撤会一直亮着（视觉上像"选中了"）。
  grid.querySelectorAll('.golink').forEach(a=>{
    const on  = ()=>a.classList.add('is-hot');
    const off = ()=>a.classList.remove('is-hot');
    a.addEventListener('mouseenter', on);
    a.addEventListener('mouseleave', off);
    a.addEventListener('focus', on);
    a.addEventListener('blur', off);
    a.addEventListener('click', off);
  });

  // counters
  // 顶栏统计：先报"收录总数"，再报"已通关数"——面向访客陈述这个清单的规模与成色，
  // 不再用「14/16」那种进度条式写法（那是记录者视角，和本页定位相冲）。
  const n = k => GAMES.filter(g=>g.status===k).length;
  document.getElementById('c-all').textContent = GAMES.length;
  document.getElementById('c-ok').textContent  = n('played');
}
render();

/* ---------- intro: sweep -> veil lifts -> the list wakes up ---------- */
intro.addEventListener('click',()=>{
  intro.classList.add('sweeping');
  grid.classList.add('enter');
  document.body.classList.remove('locked');
  setTimeout(()=>intro.classList.add('gone'),300);
  setTimeout(()=>intro.remove(),1600);
},{once:true});
</script>
