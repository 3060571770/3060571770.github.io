<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F🌸B🌸游戏记录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<meta name="description" content="F🌸B🌸游戏记录 —— 我玩过的视觉小说与 galgame 收藏册。">
<meta property="og:title" content="F🌸B🌸游戏记录">
<meta property="og:description" content="我玩过的视觉小说与 galgame 收藏册。">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" onload="this.onload=null;this.rel='stylesheet'">
<style>

:root{
  --bg:#0b0906;
  --gold:#c9a86a;
  --gold-dim:#9a7d4a;
  --text:#e9dfc8;
  --text-dim:rgba(233,223,200,.52);
  --green:#9bb884;
  --grey:#9a9184;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1500px 950px at 50% 24%,#2a1b0e 0%,#150e08 55%,#0a0705 100%) fixed #0d0906;
  color:var(--text);
  font-family:"LXGW WenKai","LXGW WenKai Screen","Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.locked{overflow:hidden}
::selection{background:rgba(201,168,106,.3)}

/* ---------- ambient background ---------- */
/* ---------- patterned backdrop: shippo ground (sakura-shaped cutouts) + constellations + blossoms ---------- */
#patwrap{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.pat-a{
  position:absolute;inset:0;opacity:.048;background-size:44px 44px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 44 44'><g fill='none' stroke='%23c9a86a' stroke-width='1'><circle cx='22' cy='22' r='22'/><circle cx='0' cy='0' r='22'/><circle cx='44' cy='0' r='22'/><circle cx='0' cy='44' r='22'/><circle cx='44' cy='44' r='22'/></g></svg>");
}
.pat-d{position:absolute;inset:0}
.blossom{position:absolute;font-size:560px;opacity:.17;top:-190px;left:-130px;transform:rotate(14deg);filter:grayscale(.2) sepia(.42) brightness(.66) saturate(1)}
.blossom.b2{font-size:640px;opacity:.15;top:auto;left:auto;bottom:-210px;right:-150px;transform:rotate(-18deg)}
.b-core{position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(122,62,76,.48);filter:blur(9px);left:95px;top:255px}
.b-core.c2{width:270px;height:270px;background:rgba(122,62,76,.5);filter:blur(10px);left:auto;top:auto;right:90px;bottom:20px}
.petal-frag{position:absolute;background:rgba(201,168,106,.15);border-radius:100% 0 100% 0}
#pcv{position:fixed;inset:0;z-index:6;pointer-events:none}
.glow{position:fixed;border-radius:50%;filter:blur(100px);z-index:0;pointer-events:none}
.g0{width:1900px;height:1050px;top:-470px;left:50%;margin-left:-950px;background:radial-gradient(ellipse at center,rgba(188,126,58,.42),transparent 66%);filter:blur(70px)}
.g1{width:840px;height:840px;top:-330px;left:-270px;background:radial-gradient(circle,rgba(222,152,66,.50),transparent 70%);animation:drift1 70s ease-in-out infinite alternate}
.g2{width:740px;height:740px;right:-290px;bottom:-310px;background:radial-gradient(circle,rgba(178,80,40,.40),transparent 70%);animation:drift2 92s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(150px,110px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-160px,-80px)}}
.noise{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  background-size:180px 180px;
}

/* ---------- top bar (solid, no glass) ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(rgba(11,9,6,.97),rgba(11,9,6,.84));
  border-bottom:1px solid rgba(201,168,106,.16);
}
.topbar-inner{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:26px;
  padding:22px 46px 16px;
}
.brand .logo{font-size:19px;letter-spacing:.25em;color:var(--text)}
.brand .logo em{font-style:normal;color:var(--gold)}
.brand .sub{font-size:9.5px;letter-spacing:.46em;color:rgba(233,223,200,.3);margin-top:5px}
.counter{font-size:12px;letter-spacing:.2em;color:var(--text-dim);white-space:nowrap}
.counter b{color:var(--gold);font-weight:500}

/* ---------- the list: one game per row (tile + info board) ---------- */
.grid{
  position:relative;z-index:5;
  display:flex;flex-direction:column;
  gap:58px;
  max-width:1280px;margin:0 auto;
  padding:64px 46px 150px;
}
.cell{
  position:relative;
  display:flex;gap:48px;align-items:stretch;
  opacity:.45;
  filter:blur(7px) brightness(.6) saturate(.55);
  transform:translateY(34px) rotate(var(--r0,0deg)) scale(.97);
  transition:opacity 1s ease,filter 1s ease,transform 1.1s cubic-bezier(.2,1.32,.34,1);
  transition-delay:calc(var(--i) * 42ms + 60ms);
  will-change:transform,opacity;
}
.grid.enter .cell{opacity:1;filter:none;transform:none}

/* tile: the acrylic brick (keeps all hover behaviour) */
.tile{position:relative;width:150px;flex:none}
.halo{
  position:absolute;inset:-8px;z-index:0;pointer-events:none;opacity:0;
  background:conic-gradient(from 210deg,#ff5f7a,#ffb454,#f6f36a,#7dff9a,#5ad0ff,#8f7bff,#ff6ad5,#ff5f7a);
  filter:blur(20px) saturate(1.15);
  transition:opacity .5s ease;
}
.cell:has(.card:hover) .halo{opacity:.34}
.card{
  position:relative;z-index:1;aspect-ratio:2/3;cursor:default;
  border-radius:0;
  background:rgba(17,13,9,.65);
  box-shadow:
    0 1px 0 rgba(255,246,228,.14),
    0 3px 0 rgba(255,246,228,.05),
    0 7px 0 rgba(0,0,0,.32),
    0 20px 36px rgba(0,0,0,.5);
  transform:perspective(850px)
            rotate(calc(var(--r,0) * 1deg)) translateY(calc(var(--dy,0) * 1px))
            rotateY(calc(var(--tx,0) * 7deg))
            rotateX(calc(var(--ty,0) * -5.5deg));
  transition:transform .5s cubic-bezier(.2,.8,.25,1.12),box-shadow .45s ease;
}
.card:hover{
  z-index:6;
  transform:perspective(850px)
            rotate(calc(var(--r,0) * 1deg)) translateY(calc(var(--dy,0) * 1px - 9px))
            rotateY(calc(var(--tx,0) * 7deg))
            rotateX(calc(var(--ty,0) * -5.5deg));
  box-shadow:
    0 1px 0 rgba(255,246,228,.22),
    0 3px 0 rgba(255,246,228,.07),
    0 7px 0 rgba(0,0,0,.3),
    0 30px 56px rgba(0,0,0,.6),
    0 0 26px rgba(201,168,106,.3),
    0 0 56px rgba(176,122,255,.18),
    0 0 88px rgba(255,140,180,.1);
}
.view{position:absolute;inset:0;overflow:hidden;background:#0f0b07}
.view img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.001);transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .5s}
.card:hover .view img{transform:scale(1.04)}
.view::after{ /* shading under the glass */
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 20px rgba(0,0,0,.25),inset 0 -4px 8px rgba(0,0,0,.28),inset -1px 0 0 rgba(0,0,0,.22);
}

/* acrylic glass surface: prism edges, corner glints, diagonal sheen */
.glass{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  mix-blend-mode:screen;
  background:
    radial-gradient(42px 42px at 0 0,rgba(255,255,255,.14),transparent 72%),
    radial-gradient(34px 34px at 100% 0,rgba(255,255,255,.09),transparent 72%),
    radial-gradient(46px 46px at 100% 100%,rgba(255,255,255,.06),transparent 72%),
    radial-gradient(38px 38px at 0 100%,rgba(255,255,255,.05),transparent 72%),
    linear-gradient(133deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 24%,transparent 40%,transparent 63%,rgba(255,255,255,.025) 80%,rgba(255,255,255,.07) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.2),
    inset 0 1px 0 rgba(255,255,255,.36),
    inset 1px 0 0 rgba(255,255,255,.1);
}

/* played — warm memory */
.card.played .view img{filter:saturate(1.05) brightness(1.04)}
.card.played:hover .view img{filter:saturate(1.08) brightness(1.1)}
.card.played .view::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 30%,rgba(255,226,170,.1),transparent 64%);
}

/* playing — spirit in motion */
.card.playing .view img{filter:saturate(1.02)}
.card.playing:hover .view img{filter:saturate(1.05) brightness(1.06)}

/* wish — 封面同样彩色展示（状态由信息板徽章表示） */

/* prismatic scattering — the rainbow light follows the cursor */
.prism{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  opacity:0;transition:opacity .4s ease;
  mix-blend-mode:screen;
  background:radial-gradient(190px circle at var(--mx,50%) var(--my,42%),
    rgba(255,92,112,.58),rgba(255,196,76,.52) 16%,rgba(130,255,150,.48) 32%,
    rgba(80,178,255,.52) 48%,rgba(190,120,255,.55) 64%,rgba(255,92,112,0) 79%);
  filter:blur(6.5px) saturate(1.4);
}
.card:hover .prism{opacity:.85}

/* info board: the old modal contents, sitting right beside the tile */
.info{
  flex:1;min-width:0;position:relative;
  display:flex;flex-direction:column;justify-content:center;
  padding:24px 42px;
  background:linear-gradient(150deg,rgba(42,31,18,.5) 0%,rgba(22,16,10,.62) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,240,210,.12),
    inset 0 1px 0 rgba(255,240,210,.18),
    0 22px 44px rgba(0,0,0,.42);
}
.info::after{ /* soft glass sheen */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(180px 100px at 0 0,rgba(255,240,210,.07),transparent 72%),
    linear-gradient(120deg,rgba(255,240,210,.05) 0%,transparent 42%);
}
.info-head{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:7px}
.info-head h3{font-size:23px;font-weight:400;letter-spacing:.05em;margin:0;line-height:1.3}
.badge{padding:3px 12px;border:1px solid;font-size:11.5px;letter-spacing:.2em;flex:none;white-space:nowrap}
.badge.played{color:var(--gold);border-color:rgba(201,168,106,.5)}
.badge.playing{color:var(--green);border-color:rgba(155,184,132,.5)}
.badge.wish{color:var(--grey);border-color:rgba(154,145,132,.5)}
.orig{font-size:12.5px;letter-spacing:.1em;color:var(--text-dim);margin:0 0 12px}
.stars{font-size:14.5px;letter-spacing:.3em;color:var(--gold);margin-bottom:12px}
.stars .off{color:rgba(255,255,255,.13)}
.stars .none{font-size:12px;letter-spacing:.22em;color:var(--grey)}
.note{font-size:14.5px;line-height:1.95;letter-spacing:.02em;color:rgba(233,223,200,.85);margin:0}

/* ---------- footer ---------- */
.foot{
  position:relative;z-index:5;text-align:center;
  padding:0 0 46px;font-size:10.5px;letter-spacing:.3em;color:rgba(233,223,200,.26);
}

/* ---------- intro splash (semi-transparent veil) ---------- */
#intro{
  position:fixed;inset:0;z-index:100;cursor:pointer;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(860px 560px at 50% 43%,
    rgba(8,6,4,.92) 0%,rgba(8,6,4,.62) 55%,rgba(9,7,5,.26) 100%);
  transition:opacity .9s ease,visibility .9s;
}
#intro.gone{opacity:0;visibility:hidden}
.intro-inner{text-align:center;transform:translateY(-2vh)}
#intro h1{
  font-size:46px;font-weight:400;letter-spacing:.3em;text-indent:.3em;
  margin:0 0 22px;color:var(--text);
  opacity:0;animation:fadeUp 1.5s .25s ease forwards;
}
#intro h1 em{font-style:normal;color:var(--gold)}
.intro-sub{
  font-size:13.5px;letter-spacing:.34em;color:rgba(233,223,200,.55);
  margin:0 0 68px;text-shadow:0 0 18px rgba(0,0,0,.9);
  opacity:0;animation:fadeUp 1.5s .8s ease forwards;
}
.intro-click{
  font-size:10.5px;letter-spacing:.42em;color:var(--gold-dim);
  opacity:0;animation:fadeUp 1.3s 1.5s ease forwards;
}
.intro-click span{display:inline-block;animation:breathe 2.6s 2.4s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.intro-line{width:1px;height:56px;margin:34px auto 30px;background:linear-gradient(transparent,rgba(201,168,106,.55),transparent);opacity:0;animation:fadeUp 1.3s 1.15s ease forwards}
.sweep{
  position:absolute;top:-10%;bottom:-10%;left:-30%;width:20vw;pointer-events:none;
  background:linear-gradient(100deg,
    transparent 0%,rgba(255,236,196,0) 16%,rgba(255,236,196,.22) 42%,
    rgba(255,246,222,.4) 50%,rgba(255,236,196,.22) 58%,rgba(255,236,196,0) 84%,transparent 100%);
  transform:skewX(-14deg) translateX(0);opacity:0;
}
#intro.sweeping .sweep{animation:sweep 1.15s cubic-bezier(.45,.05,.35,1) forwards}
@keyframes sweep{
  0%{opacity:0;transform:skewX(-14deg) translateX(0)}
  12%{opacity:1}
  88%{opacity:1}
  100%{opacity:0;transform:skewX(-14deg) translateX(140vw)}
}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(233,223,200,.14)}
::-webkit-scrollbar-thumb:hover{background:rgba(201,168,106,.35)}

@media (max-width:900px){
  .topbar-inner{padding:16px 20px 12px}
  .grid{padding:40px 20px 90px;gap:56px}
  .cell{flex-direction:column;gap:26px}
  .tile{width:62%;margin:0 auto}
  .info{padding:26px 24px}
  #intro h1{font-size:30px;letter-spacing:.32em;text-indent:.32em}
  .intro-sub{font-size:12px;letter-spacing:.18em;padding:0 20px}
}
</style>
</head>

<script>
/* =====================================================================
   游戏数据区 —— 新增游戏时在这里添加条目，并把封面图放进 images/
   status: played(已玩) | playing(进行中) | wish(未玩)
   ===================================================================== */
const GAMES = [
  /* —— 近月少女的礼仪系列（Navel，按发售顺序） —— */
  {slug:'tsukiniyorisou-1',   zh:'近月少女的礼仪',        orig:'月に寄りそう乙女の作法',                year:2012, status:'played'},
  {slug:'otomeriron',         zh:'少女理论及其周边',      orig:'乙女理論とその周辺 -Ecole de Paris-',   year:2013, status:'played'},
  {slug:'tsukiniyorisou-2',   zh:'近月少女的礼仪2',       orig:'月に寄りそう乙女の作法2',               year:2014, status:'played'},
  {slug:'belle-epoque',       zh:'少女理论及其之后的周边', orig:'乙女理論とその後の周辺 -Belle Époque-', year:2016, status:'played'},
  {slug:'tsukiniyorisou-2-1', zh:'近月少女的礼仪2.1',     orig:'月に寄りそう乙女の作法2.1 E×S×PAR!!',  year:2017, status:'played'},
  {slug:'tsukiniyorisou-2-2', zh:'近月少女的礼仪2.2',     orig:'月に寄りそう乙女の作法2.2 A×L+SA!!',   year:2017, status:'played'},
  /* —— 其他 —— */
  {slug:'otoboku-1',   zh:'少女爱上姐姐',               orig:'処女はお姉さまに恋してる',              year:2005, status:'played'},
  {slug:'mugenkairou', zh:'梦幻廻廊',                   orig:'夢幻廻廊',                              year:2005, status:'played'},
  {slug:'kirakira',    zh:'KIRA☆KIRA 煌煌舞台',         orig:'キラ☆キラ',                             year:2007, status:'played'},
  {slug:'ruitomo',     zh:'智以类聚',                   orig:'るいは智を呼ぶ',                        year:2008, status:'played'},
  {slug:'otoboku-2',   zh:'少女爱上姐姐2',              orig:'処女はお姉さまに恋してる ～2人のエルダー～', year:2010, status:'played'},
  {slug:'tenshi-hane', zh:'不要践踏天使的羽毛',         orig:'天使の羽根を踏まないでっ',              year:2011, status:'played'},
  {slug:'mangekyou-4', zh:'美少女万华镜4 -罪与罚的少女-', orig:'美少女万華鏡 -罪と罰の少女-',         year:2017, status:'played'},
  {slug:'monkeys',     zh:'Monkeys!¡',                  orig:'Monkeys!¡',                             year:2021, status:'played'},
];
/* =================================================================== */

const STATUS = {
  played : {badge:'已玩'},
  playing: {badge:'进行中'},
  wish   : {badge:'未玩'},
};

const grid = document.getElementById('grid');
const intro = document.getElementById('intro');

/* ---------- patterned backdrop: shippo ground with sakura cutouts + petals ---------- */
(function backdrop(){
  const wrap = document.getElementById('patwrap');

  // a few fallen petals, scattered
  for (let i = 0; i < 16; i++) {
    const s = 14 + Math.random()*22;
    const pt = document.createElement('i');
    pt.className = 'petal-frag';
    pt.style.cssText = `width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;transform:rotate(${(Math.random()*360).toFixed(0)}deg)`;
    wrap.appendChild(pt);
  }

  // shippo ground, with the pattern "cut away" wherever a blossom sits
  const PETALS = ["", "rotate(72)", "rotate(144)", "rotate(216)", "rotate(288)"]
    .map(t => "<g" + (t ? " transform='" + t + "'" : "") + "><ellipse cx='0' cy='-38' rx='30' ry='40'/></g>").join("");
  const patA = document.getElementById('pat-a');
  function applyMask(){
    const W = innerWidth, H = innerHeight;
    const g = (x, y, s) => `<g transform='translate(${x} ${y}) scale(${s})' fill='#fff'>${PETALS}<circle r='16'/></g>`;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'>`
      + g(205, 365, 3.46) + g(W - 225, H - 155, 3.97) + `</svg>`;
    const uri = `url("data:image/svg+xml;utf8,${svg}")`;
    const m = `linear-gradient(#fff, #fff), ${uri}`;
    patA.style.webkitMaskImage = m;  patA.style.webkitMaskComposite = 'xor';
    patA.style.maskImage = m;        patA.style.maskComposite = 'exclude';
    patA.style.webkitMaskRepeat = 'no-repeat'; patA.style.maskRepeat = 'no-repeat';
  }
  applyMask();
  addEventListener('resize', applyMask);
})();

/* ---------- stardust: drifting motes that link to the cursor ---------- */
(function stardust(){
  const cv = document.getElementById('pcv');
  const ctx = cv.getContext('2d');
  let W, H; const DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize(); window.addEventListener('resize', resize);
  const N = 130, R = 150, P = [];
  for (let i = 0; i < N; i++) {
    P.push({ x: Math.random()*W, y: Math.random()*H,
             vx: (Math.random()-.5)*.16, vy: -(.04 + Math.random()*.14),
             r: .7 + Math.random()*1.5, b: .22 + Math.random()*.4,
             big: Math.random() < .1 });
  }
  let mx = -9999, my = -9999;
  window.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; }, {passive:true});
  document.addEventListener('mouseleave', function(){ mx = -9999; my = -9999; });
  (function loop(){
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      const p = P[i];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -12) { p.y = H + 12; p.x = Math.random()*W; }
      if (p.x < -12) p.x = W + 12;
      if (p.x > W + 12) p.x = -12;
      const dx = p.x - mx, dy = p.y - my;
      const d = Math.sqrt(dx*dx + dy*dy);
      const near = d < R;
      const a = Math.min(1, p.b + (near ? (1 - d/R) * .75 : 0));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(240,223,174,' + a.toFixed(2) + ')';
      if (p.big) { ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(240,223,174,.8)'; }
      ctx.fill(); ctx.shadowBlur = 0;
      if (near) {
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mx, my);
        ctx.strokeStyle = 'rgba(240,223,174,' + ((1 - d/R) * .5).toFixed(2) + ')';
        ctx.lineWidth = .7; ctx.stroke();
      }
    }
    if (mx > -999) {
      ctx.beginPath(); ctx.arc(mx, my, 2.6, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,246,220,.9)';
      ctx.shadowBlur = 16; ctx.shadowColor = 'rgba(255,240,200,.9)';
      ctx.fill(); ctx.shadowBlur = 0;
    }
    requestAnimationFrame(loop);
  })();
})();

/* ---------- ambient glows drift with the pointer ---------- */
const g1 = document.querySelector('.g1');
const g2 = document.querySelector('.g2');
let pTx = 0, pTy = 0, cTx = 0, cTy = 0;
document.addEventListener('mousemove', e => {
  pTx = (e.clientX / window.innerWidth) * 2 - 1;
  pTy = (e.clientY / window.innerHeight) * 2 - 1;
}, { passive:true });
(function glowLoop(){
  cTx += (pTx - cTx) * 0.055;
  cTy += (pTy - cTy) * 0.055;
  const sy = window.scrollY || 0;                       // gentle scroll parallax for the glows
  g1.style.marginLeft = (cTx * 16).toFixed(1) + 'px';
  g1.style.marginTop  = (cTy * 11 - sy * 0.03).toFixed(1) + 'px';
  g2.style.marginLeft = (-cTx * 11).toFixed(1) + 'px';
  g2.style.marginTop  = (-cTy * 8 + sy * 0.05).toFixed(1) + 'px';
  requestAnimationFrame(glowLoop);
})();

/* ---------- render the list ---------- */
function render(){
  grid.innerHTML = GAMES.map((g,i)=>{
    const r    = (((i*37)%9) - 4) * 0.34;      // resting tilt  ~ -1.36..1.36 deg
    const dy   = (((i*53)%7) - 3) * 3.2;       // resting offset ~ -9.6..9.6 px
    const r0   = (((i*29)%11) - 5) * 0.9;      // entrance scatter tilt
    const s    = STATUS[g.status];
    let starsHtml = '';
    if (g.status === 'played' && g.stars) {
      starsHtml = '★'.repeat(g.stars) + `<span class="off">${'★'.repeat(5 - g.stars)}</span>`;
    } else if (g.status === 'playing') {
      starsHtml = '<span class="none">— 进行中 —</span>';
    } else if (g.status === 'wish') {
      starsHtml = '<span class="none">— 未玩 · 等待开启 —</span>';
    }
    return `
    <div class="cell" style="--i:${i};--r0:${r0.toFixed(2)}deg">
      <div class="tile">
        <i class="halo"></i>
        <div class="card ${g.status}" data-i="${i}" style="--r:${r.toFixed(2)};--dy:${dy.toFixed(1)}">
          <div class="view">
            <img src="images/${g.slug}.jpg" alt="${g.zh}" loading="lazy">
            <i class="prism"></i>
            <i class="glass"></i>
          </div>
        </div>
      </div>
      <div class="info">
        <div class="info-head">
          <h3>${g.zh}</h3>
          <span class="badge ${g.status}">${s.badge}</span>
        </div>
        <p class="orig">${g.orig}&ensp;·&ensp;${g.year}&ensp;·&ensp;PC</p>
        ${starsHtml ? `<div class="stars">${starsHtml}</div>` : ''}
        ${g.note ? `<p class="note">${g.note}</p>` : ''}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(el=>{
    // prism light + per-tile tilt follow the cursor (this tile only)
    el.addEventListener('mousemove',e=>{
      const b = el.getBoundingClientRect();
      const px = (e.clientX - b.left) / b.width;
      const py = (e.clientY - b.top) / b.height;
      el.style.setProperty('--mx',(px*100).toFixed(1)+'%');
      el.style.setProperty('--my',(py*100).toFixed(1)+'%');
      el.style.setProperty('--tx',(px*2-1).toFixed(3));
      el.style.setProperty('--ty',(py*2-1).toFixed(3));
    },{passive:true});
    el.addEventListener('mouseleave',()=>{
      el.style.setProperty('--tx','0');
      el.style.setProperty('--ty','0');
    });
  });

  // counters
  const n = k => GAMES.filter(g=>g.status===k).length;
  document.getElementById('c-ok').textContent  = n('played');
  document.getElementById('c-all').textContent = GAMES.length;
}
render();

/* ---------- intro: sweep -> veil lifts -> the list wakes up ---------- */
intro.addEventListener('click',()=>{
  intro.classList.add('sweeping');
  grid.classList.add('enter');
  document.body.classList.remove('locked');
  setTimeout(()=>intro.classList.add('gone'),300);
  setTimeout(()=>intro.remove(),1600);
},{once:true});
</script>
</body>
